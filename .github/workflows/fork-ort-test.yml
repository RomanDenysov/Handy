# Fork-only: build the x86_64 AppImage + RPM to verify the baseline ORT fix.
name: "Fork ORT test"
on:
  push:
    branches: [ci/test-ort-appimage]
jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "ubuntu-24.04"
      target: "x86_64-unknown-linux-gnu"
      build-args: "--bundles appimage,rpm"
      sign-binaries: false
      asset-prefix: "handy-ort-test"
      upload-artifacts: true
    secrets: inherit
